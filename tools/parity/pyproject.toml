[project]
name = "runntime-parity"
version = "0.1.0"
description = "Runs the PyTorch reference of each runntime model and saves its outputs for the parity tests."
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "einops==0.8.1",
    "huggingface-hub>=2.4.0",
    "numpy>=2.0",
    "opencv-python-headless==4.10.0.84",
    "opf",
    "pillow>=13.0.0",
    "pyarrow>=26.0.1",
    "reverb-tts==1.0.0",
    "safetensors>=0.8.0",
    "sentence-transformers>=6.1",
    "soundfile>=0.14.0",
    "timm>=1.0.31",
    "torch>=2.6",
    "transformers>=5.22",
]

# The upstream code of the Privacy Filter. It is not on PyPI.
[tool.uv.sources]
opf = { git = "https://github.com/openai/privacy-filter", rev = "f7f00ca7fb869683eb732c010299d901457f19c3" }

[build-system]
requires = ["uv_build>=0.9.24,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["ruff>=0.17.3"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "PTH", "RET", "PL", "PERF", "RUF"]
ignore = ["PLR2004", "PLR0911"]
