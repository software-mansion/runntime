name: Python tools

on:
  push:
    branches:
      - main
    paths:
      - tools/python/**
      - .github/workflows/python-tools.yml
  pull_request:
    branches:
      - main
      - docs
    paths:
      - tools/python/**
      - .github/workflows/python-tools.yml
  workflow_dispatch:
jobs:
  test:
    if: github.repository == 'software-mansion/runntime'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: python-tools-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: tools/python
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      # --locked fails on a stale uv.lock, like pnpm's --frozen-lockfile.
      - name: Tests
        run: uv run --locked pytest
